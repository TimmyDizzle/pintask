    <meta name="author" content="Pintask" />
    <link rel="canonical" href="https://pintask.online/" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <meta property="og:title" content="Pintask — Personal Task Tracker" />
    <meta property="og:description" content="Pintask is a personal task tracker that helps you stay organized and focused. Pin, prioritize, and manage your tasks in one simple place." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pintask.online/" />
    <meta property="og:image" content="https://pintask.online/og-image.png" />
    <meta property="og:site_name" content="Pintask" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pintask — Personal Task Tracker" />
    <meta name="twitter:description" content="Pintask is a personal task tracker that helps you stay organized and focused. Pin, prioritize, and manage your tasks in one simple place." />
    <meta name="twitter:image" content="https://pintask.online/og-image.png" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Pintask",
      "url": "https://pintask.online",
      "description": "Pintask is a personal task tracker that helps you stay organized. Pin, prioritize, and manage your tasks in one simple place.",
      "applicationCategory": "ProductivityApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>

    <!-- Google AdSense is loaded lazily via src/lib/adsense.ts after cookie consent + scroll-into-view. -->

  </head>

  <body>
    <style>
      #app-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: #1b1b1b;
        color: #c5c1b9;
        font-family: system-ui, sans-serif;
        gap: 1rem;
      }
      #app-loading .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #444;
        border-top-color: #c5c1b9;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #app-loading .spinner { animation: none; }
      }
    </style>
    <noscript>
      <div style="padding: 2rem; text-align: center; font-family: sans-serif;">
        <h1>Pintask</h1>
        <p>This app requires JavaScript to run. Please enable JavaScript in your browser.</p>
      </div>
    </noscript>
    <div id="app-loading" aria-label="Loading Pintask">
      <div class="spinner"></div>
      <p>Loading Pintask...</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
